# Runs an .apk on an Android emulator and saves what happened: the system log (logcat), the
# game's crash_log.txt and a screenshot. Actions tab > "Android test" > Run workflow, with either a
# release tag or the id of a "Release" workflow run (a test build).
name: Android test

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose .apk to test (e.g. v1.0.1)"
        required: false
      run:
        description: "...or the id of a Release workflow run whose .apk to test"
        required: false

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download the .apk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${{ inputs.run }}" ]; then
            gh run download "${{ inputs.run }}" -R "${{ github.repository }}" -n BabySmash-apk -D apk
            mv apk/*.apk app.apk
          else
            gh release download "${{ inputs.tag }}" -R "${{ github.repository }}" -p "*.apk" -O app.apk
          fi

      - name: Write the test steps
        run: |
          cat > test.sh <<'EOF'
          set -x
          PKG=io.github.adamivar.babysmash
          adb install -r -g app.apk  # -g: grant the microphone up front, so the permission prompt stays out of the way
          adb logcat -c
          adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1
          sleep 45
          adb exec-out screencap -p > screen.png
          # tap Play (bottom centre of the start screen), then poke the game a few times
          read W H < <(adb shell wm size | tail -1 | sed 's/.*: //; s/x/ /' | tr -d '\r')
          L=$(( W > H ? W : H )); S=$(( W > H ? H : W ))
          adb shell input tap $(( L / 2 )) $(( S * 91 / 100 ))
          sleep 15
          for x in 30 50 70; do adb shell input tap $(( L * x / 100 )) $(( S / 2 )); sleep 4; done
          adb exec-out screencap -p > playing.png
          adb logcat -d > logcat.txt
          adb shell run-as $PKG cat files/babysmash/crash_log.txt > crash_log.txt
          adb shell run-as $PKG ls -R files > files.txt
          true
          EOF

      - name: Enable KVM (fast emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64  # Android 11+ x86_64 images run arm apps through translation
          disable-animations: true
          script: bash test.sh  # (the runner runs each script line on its own, so the steps live in a file)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test
          path: |
            logcat.txt
            screen.png
            playing.png
            crash_log.txt
            files.txt
